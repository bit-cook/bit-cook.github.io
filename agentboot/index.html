<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>正在前往 AgentBoot</title>
    <meta name="robots" content="noindex,follow" />
    <meta http-equiv="refresh" content="0;url=/AgentBoot/" />
    <link rel="canonical" href="https://osome.work/AgentBoot/" />
    <meta name="theme-color" content="#fffdf5" />
    <style>
      :root { color-scheme: light; --ink: #12251d; --paper: #fffdf5; --green: #137a52; --sun: #ffd84d; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; background: var(--paper); color: var(--ink); font-family: ui-rounded, "Avenir Next Rounded", "Segoe UI", system-ui, sans-serif; }
      main { width: min(560px, 100%); border: 2px solid var(--ink); border-radius: 24px; background: #fff; padding: clamp(30px, 8vw, 58px); box-shadow: 14px 14px 0 var(--sun); }
      .mark { display: grid; width: 44px; height: 44px; place-items: center; border: 2px solid var(--ink); border-radius: 13px; background: var(--sun); font: 800 22px/1 ui-monospace, monospace; }
      h1 { margin: 28px 0 10px; font-size: clamp(30px, 7vw, 46px); letter-spacing: -.04em; line-height: 1.05; }
      p { margin: 0; color: #5b7067; line-height: 1.7; }
      a { display: inline-flex; min-height: 44px; align-items: center; margin-top: 24px; color: var(--green); font-weight: 750; text-underline-offset: .2em; }
      a:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }
    </style>
    <script>
      (function () {
        var target = "/AgentBoot/" + window.location.search + window.location.hash;
        window.location.replace(target);
      })();
    </script>
  </head>
  <body>
    <main>
      <span class="mark" aria-hidden="true">›_</span>
      <h1>Agent 正在就位</h1>
      <p>正在前往 AgentBoot 项目主页。页面通常会立即打开；若浏览器阻止自动跳转，可使用下方链接。</p>
      <a href="/AgentBoot/">继续前往 AgentBoot →</a>
    </main>
  </body>
</html>
