name: Deploy site

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, Linux, X64, osome-pages]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Generate lowercase path alias (agentboot -> AgentBoot)
        shell: bash
        run: |
          rm -rf agentboot
          cp -a AgentBoot agentboot
          # 小写路径仅作别名，避免搜索引擎收录重复内容
          sed -i 's#</head>#<meta name="robots" content="noindex">\n</head>#' agentboot/index.html agentboot/en/index.html
      - name: Verify AgentBoot homepage aliases
        shell: bash
        run: |
          test -f AgentBoot/index.html
          test -f agentboot/index.html
          cmp -s AgentBoot/install.sh agentboot/install.sh
          cmp -s AgentBoot/install.ps1 agentboot/install.ps1
          grep -F 'og:image' AgentBoot/index.html
          grep -F 'agentboot-brand' 404.html
          grep -F 'location.replace' 404.html
          test -f AgentBoot-Brand/index.html
          test -f AgentBoot-Brand/svg/logo-mark.svg
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  verify:
    if: github.event_name == 'pull_request'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Generate lowercase path alias (agentboot -> AgentBoot)
        shell: bash
        run: |
          rm -rf agentboot
          cp -a AgentBoot agentboot
          sed -i 's#</head>#<meta name="robots" content="noindex">\n</head>#' agentboot/index.html agentboot/en/index.html
      - name: Verify AgentBoot homepage aliases
        run: |
          test -f AgentBoot/index.html
          test -f agentboot/index.html
          cmp -s AgentBoot/install.sh agentboot/install.sh
          cmp -s AgentBoot/install.ps1 agentboot/install.ps1
          grep -F 'og:image' AgentBoot/index.html
          grep -F 'agentboot-brand' 404.html
          grep -F 'location.replace' 404.html
          test -f AgentBoot-Brand/index.html
          test -f AgentBoot-Brand/svg/logo-mark.svg
