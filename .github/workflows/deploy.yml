name: Deploy site

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, Linux, X64, osome-pages]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify lowercase AgentBoot alias
        shell: bash
        run: |
          test -f agentboot/index.html
          if grep -qF 'window.location.replace' agentboot/index.html; then
            grep -F 'https://osome.work/AgentBoot/' agentboot/index.html
          else
            # Pages backend may have cached /AgentBoot/; fall back to GitHub Release.
            grep -F 'github.com/bit-cook/AgentBoot/releases/tag/v1.3.0' agentboot/index.html
          fi
          test -f AgentBoot/assets/site.css
          test -f AgentBoot/en/index.html
          grep -F 'v1.3.0' AgentBoot/index.html
          grep -F 'v1.3.0' AgentBoot/install.sh
          grep -F "v1.3.0" AgentBoot/install.ps1
          (cd AgentBoot && sha256sum -c agentboot-online-v1.3.0.tar.gz.sha256 agentboot-online-v1.3.0.zip.sha256)
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  verify:
    if: github.event_name == 'pull_request'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify lowercase AgentBoot alias
        run: |
          test -f agentboot/index.html
          if grep -qF 'window.location.replace' agentboot/index.html; then
            grep -F 'https://osome.work/AgentBoot/' agentboot/index.html
          else
            grep -F 'github.com/bit-cook/AgentBoot/releases/tag/v1.3.0' agentboot/index.html
          fi
          test -f AgentBoot/assets/site.css
          test -f AgentBoot/en/index.html
          grep -F 'v1.3.0' AgentBoot/index.html
          grep -F 'v1.3.0' AgentBoot/install.sh
          grep -F "v1.3.0" AgentBoot/install.ps1
          (cd AgentBoot && sha256sum -c agentboot-online-v1.3.0.tar.gz.sha256 agentboot-online-v1.3.0.zip.sha256)
